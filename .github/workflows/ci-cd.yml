name: CI/CD Pipeline

on: 
push:
branches:
- main
- develop

pull_request:
branches:
- main
- develop

jobs:
lint:
name: Code Lint
runs-on: ubuntu-latest


steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install dependencies
    run: npm install

  - name: Run ESLint
    run: npm run lint
test:
name: Run Tests
runs-on: ubuntu-latest


services:
  postgres:
    image: postgres:16
    env:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops123
      POSTGRES_DB: devops_kt3
    ports:
      - 5432:5432
    options: >-
      --health-cmd "pg_isready -U devops -d devops_kt3"
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5

env:
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: devops
  DB_PASSWORD: devops123
  DB_NAME: devops_kt3

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install dependencies
    run: npm install

  - name: Run Jest
    run: npm test
