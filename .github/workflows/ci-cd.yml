name: CI/CD Pipeline

on: 
push:
branches:
- main
- develop

pull_request:
branches:
- main
- develop

jobs:
lint:
name: Code Lint
runs-on: ubuntu-latest


steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install dependencies
    run: npm install

  - name: Run ESLint
    run: npm run lint
test:
name: Run Tests
runs-on: ubuntu-latest
needs: lint


steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install dependencies
    run: npm install

  - name: Run Jest
    run: npm test
build-and-push:
name: Build and Push Docker
runs-on: ubuntu-latest
needs: test
if: github.event_name == 'push' && github.ref == 'refs/heads/main'


permissions:
  contents: read
  packages: write

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Login to GHCR
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Build and Push
    uses: docker/build-push-action@v6
    with:
      context: .
      push: true
      tags: ghcr.io/${{ github.repository_owner }}/devops-kt3:latest
